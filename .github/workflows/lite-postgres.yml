name: Gate Lite PostgreSQL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_PG_URL: postgresql://ci_test:ci_test@127.0.0.1:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Apply migrations in disposable database
        run: |
          for f in neon/migrations/0*.sql neon/migrations/10*.sql; do
            case "$f" in *012_superadmin_post_deploy.sql) continue;; esac
            echo "Applying $f"
            psql "$CI_PG_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: node tests/postgres-lite.cjs
      - name: Verify native backup and restore
        run: |
          pg_dump --format=custom --no-owner --no-acl "$CI_PG_URL" -f /tmp/lite-ci.dump
          psql "$CI_PG_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ci_restore"
          pg_restore --no-owner --no-acl --exit-on-error --dbname=postgresql://ci_test:ci_test@127.0.0.1:5432/ci_restore /tmp/lite-ci.dump
          test "$(psql postgresql://ci_test:ci_test@127.0.0.1:5432/ci_restore -Atc 'SELECT count(*) FROM dp.orders')" = 2
