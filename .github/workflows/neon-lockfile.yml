name: Gerar lockfile do driver Neon
on:
  push:
    branches: [feat/neon-efficient-backoffice-asaas-sandbox-20261122]
    paths: [package.json]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile reproduzível
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(neon): atualizar package-lock para driver fixado"
            git push origin HEAD:feat/neon-efficient-backoffice-asaas-sandbox-20261122
          fi
