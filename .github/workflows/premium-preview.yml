name: Validar preview premium
on:
  push:
    branches: [preview/panquecao-premium]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Suite completa (APIs simuladas)
        run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/premium-http.log 2>&1 &
          node tests/premium-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-screenshots
          path: artifacts/premium/
          if-no-files-found: ignore
          retention-days: 7
