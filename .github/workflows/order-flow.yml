name: Validar checkout

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar cardápio e checkout (sem pedidos reais)
        run: npm test
      - name: Validar cache e orçamento de imagens
        run: node tests/cache-policy.cjs
      - name: Conferir responsividade real no Chromium
        run: node tests/responsive-browser.cjs
      - name: Guardar cupom térmico fictício para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupom-termico-58mm-ficticio
          path: artifacts/thermal/*.pdf
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar capturas de telas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-responsividade
          path: artifacts/responsive/*.png
          if-no-files-found: ignore
          retention-days: 7
