name: Gerar imagens leves do cardápio (branch de performance)

on:
  push:
    branches:
      - feat/performance-cardapio-20261117
    paths:
      - scripts/generate-cardapio-lite.py
      - .github/workflows/generate-cardapio-lite.yml
      - img/cardapio/**

# Limitado a branch própria, sem dados de clientes ou deploy.
permissions:
  contents: write
concurrency:
  group: cardapio-lite-performance
  cancel-in-progress: false

jobs:
  compress:
    if: github.repository == 'XTL-Tech/opanquecao' && github.ref == 'refs/heads/feat/performance-cardapio-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Gerar thumbnails
        run: python scripts/generate-cardapio-lite.py
      - name: Versionar thumbnails gerados nesta branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/performance-cardapio-20261117"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/cardapio-lite/
          if ! git diff --cached --quiet; then
            git commit -m "perf(images): generate 82 lightweight WebP product thumbnails"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          else
            echo "As thumbnails já estão atualizadas."
          fi
